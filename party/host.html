<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looking for Love · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Barlow+Condensed:wght@400;600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0d0905;
  --cream: #f2e8d9;
  --gold: #c8a96e;
  --gold-dk: #8a6a3a;
  --gold-xd: #4a3520;
  --burnt: #c4391c;
}

body {
  background: var(--bg);
  color: var(--cream);
  font-family: 'Barlow Condensed', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid rgba(200,169,110,0.08);
  flex-shrink: 0;
}

.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--cream);
}

.header-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--gold-dk);
  display: block;
  margin-top: 2px;
}

.header-count { text-align: center; }
.count-num {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--cream);
  line-height: 1;
  display: block;
}
.count-label {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-xd);
  display: block;
  margin-top: 1px;
}

/* ── LAYOUT ── */
.body {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid rgba(200,169,110,0.08);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  overflow-y: auto;
}

.sidebar-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-xd);
  margin-bottom: 8px;
  display: block;
}

.qr-block { text-align: center; }

.qr-frame {
  display: inline-block;
  padding: 7px;
  background: #fff;
  border: 1px solid rgba(200,169,110,0.12);
  border-radius: 2px;
}
.qr-frame img { display: block; width: 136px; height: 136px; }
.qr-url {
  font-size: 8px;
  letter-spacing: 0.05em;
  color: var(--gold-xd);
  margin-top: 7px;
  word-break: break-all;
  line-height: 1.5;
  display: block;
}

.btn-phase {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(200,169,110,0.14);
  background: transparent;
  color: var(--gold-xd);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 5px;
}
.btn-phase:hover { border-color: rgba(200,169,110,0.3); color: var(--cream); }
.btn-phase.active {
  background: rgba(196,57,28,0.12);
  border-color: rgba(196,57,28,0.45);
  color: var(--cream);
}
.btn-icon { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }

.btn-danger {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid rgba(196,57,28,0.18);
  background: transparent;
  color: rgba(196,57,28,0.5);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
  margin-top: 2px;
}
.btn-danger:hover { border-color: var(--burnt); color: var(--burnt); }

.sidebar-divider { height: 1px; background: rgba(200,169,110,0.07); }

/* ── MAIN DISPLAY ── */
.display {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  overflow: hidden;
}

/* Waiting view */
.view-waiting { text-align: center; }

.waiting-big {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 4vw, 56px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--cream);
  line-height: 1;
  margin-bottom: 10px;
}
.waiting-italic {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(14px, 1.8vw, 22px);
  color: var(--gold-dk);
  margin-bottom: 28px;
}
.waiting-hint {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-xd);
}

/* Cloud view */
.view-cloud {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.cloud-eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--gold-dk);
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 20px;
  flex-shrink: 0;
}

.word-cloud {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 20px;
  overflow: hidden;
}

.cloud-word {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  transition: font-size 0.5s ease;
  animation: wordIn 0.4s ease forwards;
}
@keyframes wordIn {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1);   }
}

.cloud-empty {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--gold-xd);
  text-align: center;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Looking for Love</div>
    <span class="header-sub">Private Listening Session &nbsp;&middot;&nbsp; Host</span>
  </div>
  <div class="header-count">
    <span class="count-num" id="word-count">0</span>
    <span class="count-label">Reactions</span>
  </div>
</div>

<div class="body">
  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="qr-block">
      <span class="sidebar-label">Scan to Join</span>
      <div class="qr-frame">
        <img id="qr-img" src="" alt="QR" />
      </div>
      <span class="qr-url" id="qr-url-text"></span>
    </div>

    <div class="sidebar-divider"></div>

    <div>
      <span class="sidebar-label">Controls</span>
      <button class="btn-phase active" id="btn-bingo" onclick="setPhase('bingo')">
        <span class="btn-icon">&#9783;</span> Show Bingo Cards
      </button>
      <button class="btn-phase" id="btn-submit" onclick="setPhase('submit')">
        <span class="btn-icon">&#9679;</span> Collect Reactions
      </button>
    </div>

    <div>
      <span class="sidebar-label">Reset</span>
      <button class="btn-danger" onclick="clearWords()">&#8635;&nbsp; Clear All Words</button>
    </div>

  </div>

  <!-- DISPLAY -->
  <div class="display">

    <div id="view-waiting" class="view-waiting">
      <div class="waiting-big">Looking for Love</div>
      <div class="waiting-italic">Private Listening Session &mdash; Sia Amun</div>
      <div class="waiting-hint">Guests are reviewing their bingo cards</div>
    </div>

    <div id="view-cloud" class="view-cloud hidden">
      <div class="cloud-eyebrow">first word reactions &mdash; live</div>
      <div class="word-cloud" id="word-cloud">
        <div class="cloud-empty" id="cloud-empty">Waiting for the first reaction&hellip;</div>
      </div>
    </div>

  </div>
</div>

<script>
// ── QR CODE ───────────────────────────────────────────────────────────────────
var guestUrl = '';

fetch('/api/info')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    guestUrl = data.guestUrl;
    document.getElementById('qr-url-text').textContent = guestUrl;
    document.getElementById('qr-img').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=136x136&color=000000&bgcolor=ffffff&data=' +
      encodeURIComponent(guestUrl);
  });

// ── PHASE CONTROL ─────────────────────────────────────────────────────────────
var currentPhase = 'bingo';

function setPhase(phase) {
  fetch('/api/phase', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phase: phase })
  });

  currentPhase = phase;
  document.getElementById('btn-bingo').classList.toggle('active', phase === 'bingo');
  document.getElementById('btn-submit').classList.toggle('active', phase === 'submit');
  document.getElementById('view-waiting').classList.toggle('hidden', phase !== 'bingo');
  document.getElementById('view-cloud').classList.toggle('hidden', phase !== 'submit');
}

// ── WORD CLOUD POLLING ────────────────────────────────────────────────────────
var COLORS = ['#f2e8d9', '#c8a96e', '#c4391c', '#e2cfa0', '#d4956a'];
var lastUpdate = 0;

function wordColor(word) {
  var n = word.split('').reduce(function(a, c) { return a + c.charCodeAt(0); }, 0);
  return COLORS[n % COLORS.length];
}

function pollWords() {
  fetch('/api/words')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.lastUpdate === lastUpdate) return;
      lastUpdate = data.lastUpdate;

      // Build word frequency map
      var counts = {};
      data.words.forEach(function(entry) {
        var w = entry.word;
        counts[w] = (counts[w] || 0) + 1;
      });

      document.getElementById('word-count').textContent = data.words.length;
      renderCloud(counts);
    })
    .catch(function() {});
}

function renderCloud(counts) {
  var cloud = document.getElementById('word-cloud');
  var empty = document.getElementById('cloud-empty');
  var words = Object.keys(counts);

  if (!words.length) {
    empty.style.display = '';
    cloud.querySelectorAll('.cloud-word').forEach(function(el) { el.remove(); });
    return;
  }

  empty.style.display = 'none';
  var maxCount = Math.max.apply(null, Object.values(counts));

  words.forEach(function(word) {
    var size = 18 + Math.round((counts[word] / maxCount) * 68);
    var existing = cloud.querySelector('[data-word="' + word.replace(/"/g, '') + '"]');
    if (existing) {
      existing.style.fontSize = size + 'px';
    } else {
      var el = document.createElement('div');
      el.className = 'cloud-word';
      el.setAttribute('data-word', word);
      el.textContent = word;
      el.style.fontSize = size + 'px';
      el.style.color = wordColor(word);
      cloud.appendChild(el);
    }
  });
}

setInterval(pollWords, 1500);
pollWords();

// ── CLEAR ─────────────────────────────────────────────────────────────────────
function clearWords() {
  if (!confirm('Clear all submitted words?')) return;
  fetch('/api/clear', { method: 'POST' }).then(function() {
    document.getElementById('word-count').textContent = '0';
    document.getElementById('word-cloud').querySelectorAll('.cloud-word').forEach(function(el) { el.remove(); });
    document.getElementById('cloud-empty').style.display = '';
    lastUpdate = 0;
  });
}
</script>
</body>
</html>
